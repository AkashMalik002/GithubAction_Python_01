name: workflow variables
on:
 push:
env:
 PYTHON_VERSION: 3.9      # At main level
jobs:
  job1:
   runs-on: ubuntu-latest
   steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Setup python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v5
      with:
       python-version: ${{ env.PYTHON_VERSION }}
  job2:
   runs-on: ubuntu-latest
   env:
     MYJOB-PYTHON-VERSION: 3.8  # At Job Level
   steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Setup python ${{ env.MYJOB-PYTHON-VERSION }}
      uses: actions/setup-python@v5
      with:
       python-version: ${{ env.MYJOB-PYTHON-VERSION }}
  job3:
   runs-on: ubuntu-latest
   steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Setup python
      env:
       MYSTEP-PYTHON-VERSION: 3.11  # At Step Level
      uses: actions/setup-python@v5
      with:
       python-version: ${{ env.MYSTEP-PYTHON-VERSION }}
    - name: Print a message
      env:
       APPLICATION: python
      run: echo "The application installed is $APPLICATION"
# 3 Different type of variables(Main level{Line 5}, Job Level{Line 19}, Step Level{Line 34}
